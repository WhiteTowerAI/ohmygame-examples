name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Check catalog
        run: |
          node --test scripts/*.test.mjs
          node scripts/check-catalog.mjs
      - name: Build every example
        run: |
          for example in $(node scripts/check-catalog.mjs); do
            echo "::group::$example"
            (cd "$example" && npm ci && npm test --if-present && npm run build)
            echo "::endgroup::"
          done
